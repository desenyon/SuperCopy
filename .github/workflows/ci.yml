name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit and offscreen integration tests
        run: ./scripts/test.sh
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/dmg-layout.py
      - name: Universal development DMG
        run: ./scripts/package-dmg.sh --universal --ad-hoc
      - name: Check both architectures and bundle
        run: |
          lipo dist/SuperCopy.app/Contents/MacOS/SuperCopy -verify_arch arm64
          lipo dist/SuperCopy.app/Contents/MacOS/SuperCopy -verify_arch x86_64
          codesign --verify --strict dist/SuperCopy.app
          plutil -lint dist/SuperCopy.app/Contents/Resources/PrivacyInfo.xcprivacy
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCopy-development-universal
          path: |
            dist/SuperCopy-*-development.dmg
            dist/SuperCopy-*-development.dmg.sha256
          if-no-files-found: error
          retention-days: 14
